    <main>
        <section>
            <h2 style="text-decoration: underline; color:#1a365d ;">My Student Profile</h2>
            <form>
                <p>
                    <label for="profile-name">Full Name:</label><br>
                    <input type="text" id="profile-name" value="John Doe">
                </p>
                <p>
                    <label for="profile-id">Student ID:</label><br>
                    <input type="text" id="profile-id" value="S12345678" readonly>
                </p>
                <p>
                    <label for="profile-dept">Department:</label><br>
                    <input type="text" id="profile-dept" value="Computer Science & Engineering">
                </p>
                <p>
                    <button type="submit">Update Information</button>
                </p>
            </form>
        </section>
    </main>
